<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>野球LINE速報ジェネレーター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM & Babel for standalone browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* モバイルでのタップ拡大防止とフォント設定 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea, button {
      font-size: 16px; /* iOS Safariでフォーカス時の自動ズームを抑止 */
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // インラインSVGアイコン
    const CopyIcon = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg>
    );

    const CheckIcon = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="20 6 9 17 4 12" />
      </svg>
    );

    const MapPinIcon = ({ size = 16, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
    );

    const SwordsIcon = ({ size = 16, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
        <line x1="13" y1="19" x2="19" y2="13" />
        <line x1="16" y1="16" x2="20" y2="20" />
        <line x1="19" y1="21" x2="21" y2="19" />
        <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" />
        <line x1="5" y1="14" x2="9" y2="18" />
        <line x1="7" y1="17" x2="4" y2="20" />
        <line x1="3" y1="19" x2="5" y2="21" />
      </svg>
    );

    const TypeIcon = ({ size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="4 7 4 4 20 4 20 7" />
        <line x1="9" y1="20" x2="15" y2="20" />
        <line x1="12" y1="4" x2="12" y2="20" />
      </svg>
    );

    function App() {
      const [matchName, setMatchName] = useState('福山北部招待');
      const [stadium, setStadium] = useState('引野公園野球場');
      const [weather, setWeather] = useState('☁️');
      const [opponent, setOpponent] = useState('三原浮城ベースボールクラブ');
      const [status, setStatus] = useState('試合開始');
      
      const [teamA, setTeamA] = useState('比　婆');
      const [scoresA, setScoresA] = useState(['0', '0', '0', '0', '0', '0', '', '', '']);
      const [teamB, setTeamB] = useState('浮    城');
      const [scoresB, setScoresB] = useState(['0', '2', '2', '0', '0', '', '', '', '']);
      
      const [details, setDetails] = useState('⑨新矢→矢吹  四球 １塁\n    代走 矢吹→野口\n①岡井   一ゴロ セカンドタッチアウト 二死\n②内藤   遊ゴロ 三死');
      
      const [copySuccess, setCopySuccess] = useState(false);
      const [activeCategory, setActiveCategory] = useState('batter');
      const textareaRef = useRef(null);

      const RESULT_PRESETS = {
        batter: {
          name: '打順・交代',
          items: ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '代打', '代走', '投手交代', '守備交代', '→']
        },
        hit: {
          name: '安打',
          items: ['左安', '中安', '右安', '内野安打', '左２', '中２', '右２', '左３', '中３', '右３', '本塁打', '適時打']
        },
        grounder: {
          name: 'ゴロ',
          items: ['投ゴロ', '捕ゴロ', '一ゴロ', '二ゴロ', '三ゴロ', '遊ゴロ', '内野ゴロ', '併殺打']
        },
        fly: {
          name: '飛(フライ)',
          items: ['投飛', '捕飛', '一飛', '二飛', '三飛', '遊飛', '内野飛', '左飛', '中飛', '右飛', '犠飛', '飛']
        },
        liner: {
          name: '直(ライナー)',
          items: ['投直', '捕直', '一直', '二直', '三直', '遊直', '左直', '中直', '右直', '直']
        },
        foul: {
          name: '邪(ファール)',
          items: ['捕邪飛', '一邪飛', '三邪飛', '邪飛', '捕邪', '一邪', '三邪', '邪', 'ファール']
        },
        strikeout_walk: {
          name: '三振・四死球',
          items: ['見三振', '空三振', '三振', '四球', '死球', '敬遠', '振逃']
        },
        situation: {
          name: '状況・走塁・得点',
          items: ['＋１', '＋２', '＋３', '＋４', '得点', '一死', '二死', '三死', '１塁', '２塁', '３塁', '満塁', '盗塁', '牽制死', '失策', '野選', '暴投', '捕逸', 'タッチアウト']
        },
        parts: {
          name: '単字パーツ',
          items: ['投', '捕', '一', '二', '三', '遊', '左', '中', '右', '飛', '直', '邪', 'ゴロ', '安', '犠', '＋']
        }
      };

      // 半角数字を全角数字に自動変換
      const toFullWidthNumber = (str) => {
        if (!str) return '';
        return str.replace(/[0-9]/g, function(s) {
          return String.fromCharCode(s.charCodeAt(0) + 0xFEE0);
        });
      };

      // 回ごとのスコア変更ハンドラ
      const handleScoreChange = (team, index, value) => {
        if (value !== '' && !/^[0-9]+$/.test(value)) return;

        if (team === 'A') {
          const newScores = [...scoresA];
          newScores[index] = value;
          setScoresA(newScores);
        } else {
          const newScores = [...scoresB];
          newScores[index] = value;
          setScoresB(newScores);
        }
      };

      // LINE用テキストを生成
      const generatePreviewText = () => {
        const scoreStrA = scoresA.join('');
        const scoreStrB = scoresB.join('');
        const formattedScoreA = toFullWidthNumber(scoreStrA);
        const formattedScoreB = toFullWidthNumber(scoreStrB);
        
        return `${matchName}
🏟️${stadium}${weather}
🆚${opponent}
${status}
${teamA}${formattedScoreA}
${teamB}${formattedScoreB}
${details}`;
      };

      const handleCopy = () => {
        const textToCopy = generatePreviewText();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy)
            .then(() => {
              setCopySuccess(true);
              setTimeout(() => setCopySuccess(false), 2000);
            })
            .catch(() => fallbackCopy(textToCopy));
        } else {
          fallbackCopy(textToCopy);
        }
      };

      const fallbackCopy = (text) => {
        const tempTextArea = document.createElement("textarea");
        tempTextArea.value = text;
        tempTextArea.style.position = "fixed";
        tempTextArea.style.left = "-9999px";
        document.body.appendChild(tempTextArea);
        tempTextArea.focus();
        tempTextArea.select();
        try {
          document.execCommand('copy');
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 2000);
        } catch (e) {
          console.error("Copy failed", e);
        }
        document.body.removeChild(tempTextArea);
      };

      const insertSymbol = (symbol) => {
        const textarea = textareaRef.current;
        if (textarea) {
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          let textToInsert = symbol;

          if (symbol === '\n') {
            textToInsert = '\n';
          } else if (symbol === 'SPACE') {
            textToInsert = ' ';
          } else if (symbol === 'ZEN_SPACE') {
            textToInsert = '　';
          }

          const newDetails = details.substring(0, start) + textToInsert + details.substring(end);
          setDetails(newDetails);
          
          setTimeout(() => {
            textarea.focus();
            textarea.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
          }, 10);
        } else {
          setDetails(details + (symbol === 'SPACE' ? ' ' : symbol === 'ZEN_SPACE' ? '　' : symbol));
        }
      };

      const handleDeleteChar = () => {
        const textarea = textareaRef.current;
        if (!details) return;

        if (textarea) {
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          if (start === end && start > 0) {
            const newDetails = details.substring(0, start - 1) + details.substring(end);
            setDetails(newDetails);
            setTimeout(() => {
              textarea.focus();
              textarea.setSelectionRange(start - 1, start - 1);
            }, 10);
          } else if (start !== end) {
            const newDetails = details.substring(0, start) + details.substring(end);
            setDetails(newDetails);
            setTimeout(() => {
              textarea.focus();
              textarea.setSelectionRange(start, start);
            }, 10);
          }
        } else {
          setDetails(details.slice(0, -1));
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 flex justify-center pb-28">
          <div className="w-full max-w-md bg-white shadow-xl flex flex-col min-h-screen">
            
            {/* ヘッダー */}
            <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-20">
              <h1 className="text-lg font-bold text-center flex items-center justify-center gap-2">
                <TypeIcon size={20} />
                野球LINE速報ジェネレーター
              </h1>
            </header>

            <div className="flex-1 overflow-y-auto">
              {/* プレビューエリア */}
              <div className="bg-gray-800 text-gray-100 p-4 sticky top-0 z-10 shadow-inner">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-emerald-400 border border-emerald-400 px-2 py-0.5 rounded">プレビュー（LINE送信テキスト）</span>
                </div>
                <pre className="font-mono text-xs sm:text-sm whitespace-pre-wrap leading-relaxed break-words bg-gray-900 p-3 rounded-lg border border-gray-700 select-all">
                  {generatePreviewText()}
                </pre>
              </div>

              {/* 入力フォームエリア */}
              <div className="p-4 space-y-4">
                
                {/* 試合情報 */}
                <div className="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                  <h2 className="text-sm font-bold text-gray-700 border-b pb-1">試合情報</h2>
                  
                  <div>
                    <label className="block text-xs text-gray-600 mb-1">大会名・試合名</label>
                    <input 
                      type="text" 
                      value={matchName}
                      onChange={(e) => setMatchName(e.target.value)}
                      className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"
                      placeholder="例: 福山北部招待"
                    />
                  </div>

                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-xs text-gray-600 mb-1">球場</label>
                      <div className="relative">
                        <span className="absolute left-2.5 top-2.5 text-gray-400">
                          <MapPinIcon size={16} />
                        </span>
                        <input 
                          type="text" 
                          value={stadium}
                          onChange={(e) => setStadium(e.target.value)}
                          className="w-full p-2 pl-8 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"
                        />
                      </div>
                    </div>
                    <div className="w-28">
                      <label className="block text-xs text-gray-600 mb-1">天気</label>
                      <select 
                        value={weather}
                        onChange={(e) => setWeather(e.target.value)}
                        className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white text-sm"
                      >
                        <option value="☀️">☀️ 晴</option>
                        <option value="☁️">☁️ 曇</option>
                        <option value="☂️">☂️ 雨</option>
                        <option value="🌧️">🌧️ 大雨</option>
                        <option value="❄️">❄️ 雪</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-xs text-gray-600 mb-1">対戦相手</label>
                      <div className="relative">
                        <span className="absolute left-2.5 top-2.5 text-gray-400">
                          <SwordsIcon size={16} />
                        </span>
                        <input 
                          type="text" 
                          value={opponent}
                          onChange={(e) => setOpponent(e.target.value)}
                          className="w-full p-2 pl-8 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"
                        />
                      </div>
                    </div>
                    <div className="w-32">
                      <label className="block text-xs text-gray-600 mb-1">状況</label>
                      <select 
                        value={status}
                        onChange={(e) => setStatus(e.target.value)}
                        className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white text-sm"
                      >
                        <option value="試合前">試合前</option>
                        <option value="試合開始">試合開始</option>
                        <option value="試合中">試合中</option>
                        <option value="試合終了">試合終了</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* スコア情報 (イニング入力) */}
                <div className="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                  <h2 className="text-sm font-bold text-gray-700 border-b pb-1 flex justify-between items-center">
                    <span>イニングスコア</span>
                    <span className="text-[11px] font-normal text-gray-500 bg-white px-1.5 py-0.5 border rounded">半角入力で全角に自動変換</span>
                  </h2>
                  
                  <div className="overflow-x-auto pb-1">
                    <table className="w-full text-center text-xs border-collapse min-w-[340px]">
                      <thead>
                        <tr className="text-gray-500">
                          <th className="font-medium text-left w-24 pb-1">チーム名</th>
                          {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <th key={num} className="font-medium w-7 pb-1">{num}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {/* チームA */}
                        <tr className="border-t border-gray-200">
                          <td className="py-1.5 pr-1">
                            <input 
                              type="text" 
                              value={teamA}
                              onChange={(e) => setTeamA(e.target.value)}
                              className="w-full p-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-xs font-mono"
                              placeholder="先攻チーム"
                            />
                          </td>
                          {scoresA.map((score, idx) => (
                            <td key={`A-${idx}`} className="p-0.5">
                              <input 
                                type="text" 
                                inputMode="numeric"
                                pattern="[0-9]*"
                                value={score}
                                onChange={(e) => handleScoreChange('A', idx, e.target.value)}
                                className="w-full h-8 px-0 text-center border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono text-sm"
                              />
                            </td>
                          ))}
                        </tr>
                        {/* チームB */}
                        <tr className="border-t border-gray-100">
                          <td className="py-1.5 pr-1">
                            <input 
                              type="text" 
                              value={teamB}
                              onChange={(e) => setTeamB(e.target.value)}
                              className="w-full p-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-xs font-mono"
                              placeholder="後攻チーム"
                            />
                          </td>
                          {scoresB.map((score, idx) => (
                            <td key={`B-${idx}`} className="p-0.5">
                              <input 
                                type="text" 
                                inputMode="numeric"
                                pattern="[0-9]*"
                                value={score}
                                onChange={(e) => handleScoreChange('B', idx, e.target.value)}
                                className="w-full h-8 px-0 text-center border border-gray-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono text-sm"
                              />
                            </td>
                          ))}
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* 詳細実況入力 */}
                <div className="space-y-2 bg-gray-50 p-4 rounded-xl border border-gray-200">
                  <div className="flex justify-between items-center border-b pb-1">
                    <h2 className="text-sm font-bold text-gray-700">プレイ詳細・実況入力</h2>
                    <span className="text-[11px] text-gray-500">ボタンタップで自動入力</span>
                  </div>
                  
                  {/* 打撃結果パレット */}
                  <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm space-y-2.5">
                    {/* カテゴリタブ（段組み表示） */}
                    <div className="flex flex-wrap gap-1.5 pb-2 border-b border-gray-100">
                      {Object.entries(RESULT_PRESETS).map(([key, category]) => (
                        <button
                          key={key}
                          type="button"
                          onClick={() => setActiveCategory(key)}
                          className={`px-2.5 py-1 text-xs font-bold rounded-md transition-all ${
                            activeCategory === key
                              ? 'bg-emerald-600 text-white shadow-sm ring-1 ring-emerald-700'
                              : 'bg-gray-100 text-gray-600 hover:bg-gray-200 active:bg-gray-300'
                          }`}
                        >
                          {category.name}
                        </button>
                      ))}
                    </div>

                    {/* 選択されたカテゴリのボタン一覧 */}
                    <div className="flex flex-wrap gap-1.5 min-h-[72px] items-start content-start">
                      {RESULT_PRESETS[activeCategory].items.map((item) => (
                        <button
                          key={item}
                          type="button"
                          onClick={() => insertSymbol(item)}
                          className="px-2.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 text-emerald-900 rounded-md text-xs font-semibold border border-emerald-200 shadow-xs transition-colors"
                        >
                          {item}
                        </button>
                      ))}
                    </div>

                    {/* 操作用ショートカットボタン */}
                    <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-gray-100">
                      <span className="text-[11px] text-gray-400 mr-1">操作:</span>
                      <button
                        type="button"
                        onClick={() => insertSymbol('ZEN_SPACE')}
                        className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 rounded text-xs font-bold text-gray-700 border border-gray-300"
                      >
                        全角空白
                      </button>
                      <button
                        type="button"
                        onClick={() => insertSymbol('SPACE')}
                        className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 rounded text-xs font-bold text-gray-700 border border-gray-300"
                      >
                        半角空白
                      </button>
                      <button
                        type="button"
                        onClick={() => insertSymbol('\n')}
                        className="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 active:bg-blue-200 text-blue-700 border border-blue-200 rounded text-xs font-bold"
                      >
                        ↵ 改行
                      </button>
                      <button
                        type="button"
                        onClick={handleDeleteChar}
                        className="px-2.5 py-1 bg-red-50 hover:bg-red-100 active:bg-red-200 text-red-600 border border-red-200 rounded text-xs font-bold"
                      >
                        ⌫ 1字消去
                      </button>
                      <button
                        type="button"
                        onClick={() => setDetails('')}
                        className="ml-auto px-2 py-1 text-[11px] text-gray-400 hover:text-red-500 underline"
                      >
                        全消去
                      </button>
                    </div>
                  </div>

                  <textarea
                    ref={textareaRef}
                    value={details}
                    onChange={(e) => setDetails(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none min-h-[140px] text-sm leading-relaxed font-mono"
                    placeholder="ボタンをタップして打撃結果を入力できます..."
                  ></textarea>
                </div>
                
              </div>
            </div>
            
            {/* フローティングコピーボタン */}
            <div className="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-gray-200 shadow-lg flex justify-center z-30">
              <div className="w-full max-w-md">
                <button
                  type="button"
                  onClick={handleCopy}
                  className={`w-full py-3.5 rounded-xl font-bold text-base flex items-center justify-center gap-2 transition-all duration-200 shadow-md ${
                    copySuccess 
                      ? 'bg-gray-800 text-white shadow-gray-400' 
                      : 'bg-[#06C755] hover:bg-[#05b34c] text-white shadow-[#06C755]/30'
                  }`}
                >
                  {copySuccess ? (
                    <>
                      <CheckIcon size={20} />
                      コピーしました！
                    </>
                  ) : (
                    <>
                      <CopyIcon size={20} />
                      LINE用にテキストをコピー
                    </>
                  )}
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
