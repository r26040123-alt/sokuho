<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野球速報 LINEテキスト作成ツール</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-24 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      // 初期値
      const [tournament, setTournament] = useState("");
      const [stadium, setStadium] = useState("");
      const [weather, setWeather] = useState("☀️");
      const [teamA, setTeamA] = useState("");
      const [teamB, setTeamB] = useState("");
      
      const [scoresA, setScoresA] = useState(["", "", "", "", "", "", "", "", ""]);
      const [scoresB, setScoresB] = useState(["", "", "", "", "", "", "", "", ""]);
      
      // 現在の攻撃イニングと表/裏の管理
      const [currentInning, setCurrentInning] = useState(1);
      const [currentHalf, setCurrentHalf] = useState("top"); 

      // 選手登録
      const [starters, setStarters] = useState(["", "", "", "", "", "", "", "", ""]);
      const [bench, setBench] = useState(["", "", "", "", "", ""]); 

      // テキスト管理
      const [details, setDetails] = useState("");
      const [history, setHistory] = useState("");
      const [inputTab, setInputTab] = useState("current");
      const [copied, setCopied] = useState(false);
      const [activeTab, setActiveTab] = useState('order');
      
      const currentTextareaRef = useRef(null);
      const historyTextareaRef = useRef(null);

      // 自チームのメンバーリスト
      const teamMembers = [
        "小垰(由)", "橋本", "児玉", "岡井(晴)", "小垰(央)", "八谷", "吉永", 
        "末國", "福場", "倉橋", "新矢", "黒瀬", "泉", "吉田", "曽田", 
        "中重", "内藤", "吉岡(佑)", "山口", "横山", "矢吹", "金川", 
        "吉岡(瑞)", "糸原", "竹内", "内田", "野口", "岡井(愛)"
      ];

      const toFullWidth = (str) => {
        return str.replace(/[0-9]/g, (s) => String.fromCharCode(s.charCodeAt(0) + 0xfee0));
      };

      const handleScoreChange = (team, index, value) => {
        const cleanValue = value.replace(/[^0-9]/g, '').slice(0, 2);
        if (team === 'A') {
          const newScores = [...scoresA];
          newScores[index] = cleanValue;
          setScoresA(newScores);
        } else {
          const newScores = [...scoresB];
          newScores[index] = cleanValue;
          setScoresB(newScores);
        }
      };

      const handleStarterChange = (index, value) => {
        const newStarters = [...starters];
        newStarters[index] = value;
        setStarters(newStarters);
      };

      const handleBenchChange = (index, value) => {
        const newBench = [...bench];
        newBench[index] = value;
        setBench(newBench);
      };

      const handleNextHalf = () => {
        if (currentHalf === 'top') {
          const currentScore = scoresA[currentInning - 1];
          if (currentScore === "" || currentScore === undefined) {
            const newScores = [...scoresA];
            newScores[currentInning - 1] = "0";
            setScoresA(newScores);
          }
        } else {
          const currentScore = scoresB[currentInning - 1];
          if (currentScore === "" || currentScore === undefined) {
            const newScores = [...scoresB];
            newScores[currentInning - 1] = "0";
            setScoresB(newScores);
          }
        }

        let newHistory = history;
        if (details.trim() !== "") {
          newHistory += details.trimEnd() + "\nチェンジ\n\n";
        } else {
          newHistory += "チェンジ\n\n";
        }
        setHistory(newHistory);
        setDetails("");

        if (currentHalf === 'top') {
          setCurrentHalf('bottom');
        } else {
          if (currentInning < 9) {
            setCurrentInning(currentInning + 1);
            setCurrentHalf('top');
          }
        }
        setInputTab("current");
      };

      const safeParseInt = (val) => {
        if (val === undefined || val === null || val.toString().trim() === "") return 0;
        const parsed = parseInt(val, 10);
        return isNaN(parsed) ? 0 : parsed;
      };

      // ★引数 suffix でボタンごとに後ろに追加する文字を受け取る
      const insertText = (textToInsert, shouldPrependNewline = false, suffix = "") => {
        const scoreMatch = textToInsert.match(/＋\s*([0-9１-９])/);
        if (scoreMatch) {
          const numStr = scoreMatch[1].replace(/[１-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xfee0));
          const points = parseInt(numStr, 10);
          if (currentHalf === 'top') {
            const newScores = [...scoresA];
            const currentVal = safeParseInt(newScores[currentInning - 1]);
            newScores[currentInning - 1] = (currentVal + points).toString();
            setScoresA(newScores);
          } else {
            const newScores = [...scoresB];
            const currentVal = safeParseInt(newScores[currentInning - 1]);
            newScores[currentInning - 1] = (currentVal + points).toString();
            setScoresB(newScores);
          }
        }

        const activeRef = inputTab === 'current' ? currentTextareaRef : historyTextareaRef;
        const currentText = inputTab === 'current' ? details : history;
        const setTargetText = inputTab === 'current' ? setDetails : setHistory;

        if (!activeRef.current) return;
        const textarea = activeRef.current;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;

        let newText = "";
        
        if (textToInsert === 'BACKSPACE') {
          if (start === end && start > 0) {
            newText = currentText.substring(0, start - 1) + currentText.substring(end);
            setTargetText(newText);
            setTimeout(() => {
              textarea.selectionStart = textarea.selectionEnd = start - 1;
              textarea.focus();
            }, 0);
          }
          return;
        }

        let finalInsertText = textToInsert;
        
        // スタメン等の自動改行
        if (shouldPrependNewline && start > 0) {
          if (currentText.substring(start - 1, start) !== "\n") {
            finalInsertText = "\n" + finalInsertText;
          }
        }

        // ★設定されたスペース（1個 or 2個）を末尾に追加
        finalInsertText = finalInsertText + suffix;

        newText = currentText.substring(0, start) + finalInsertText + currentText.substring(end);
        setTargetText(newText);

        setTimeout(() => {
          textarea.selectionStart = textarea.selectionEnd = start + finalInsertText.length;
          textarea.focus();
        }, 0);
      };

      const scoreAString = scoresA.map(s => s === "" ? "" : toFullWidth(s)).join("");
      const scoreBString = scoresB.map(s => s === "" ? "" : toFullWidth(s)).join("");

      const displayTeamA = teamA || "先攻";
      const displayTeamB = teamB || "後攻";
      
      const currentInningText = `${currentInning}回${currentHalf === 'top' ? '表' : '裏'}`;
      const matchStatusText = (currentInning === 1 && currentHalf === 'top') 
        ? `${currentInningText} 試合開始` 
        : `${currentInningText} 攻撃中`;
      
      const previewText = `${tournament || "大会名未入力"}
🏟️${stadium || "球場未入力"}${weather}
🆚${displayTeamB}
${matchStatusText}
${displayTeamA}${scoreAString}
${displayTeamB}${scoreBString}
${history}${details}`.trim();

      const handleCopy = () => {
        navigator.clipboard.writeText(previewText);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const orderSymbols = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"];

      const starterButtons = starters.map((name, idx) => {
        const symbol = orderSymbols[idx];
        return name ? `${symbol}${name}` : `${symbol}`;
      });

      const benchButtons = bench.filter(name => name.trim() !== "").map(name => `${name}`);

      // ★ suffix で追加するスペースの量をカテゴリごとに管理
      const presetCategories = {
        order: {
          label: "打順・スタメン",
          items: [
            ...orderSymbols,
            ...starterButtons,
            "代打", "代走", "投手交代", "守備交代", "→", "走者",
            ...benchButtons
          ],
          suffix: "  " // ★打順・スタメンのみスペース2個
        },
        team: {
          label: "選手一覧",
          items: teamMembers.map(name => `${name}`),
          suffix: " " // ★これ以降はすべてスペース1個
        },
        runner: {
          label: "塁状況",
          items: ["１塁", "２塁", "３塁", "１・２塁", "１・３塁", "２・３塁", "満塁", "本塁"],
          suffix: " "
        },
        hit: {
          label: "安打",
          items: [
            "投安", "捕安", "一安", "二安", "三安", "遊安", "左安", "中安", "右安", "内安",
            "左２", "中２", "右２", "左３", "中３", "右３", "左本", "中本", "右本", "適時打"
          ],
          suffix: " "
        },
        out: {
          label: "凡退",
          items: [
            "投ゴロ", "捕ゴロ", "一ゴロ", "二ゴロ", "三ゴロ", "遊ゴロ",
            "左飛", "中飛", "右飛", "投飛", "捕飛", "一飛", "二飛", "三飛", "遊飛",
            "投直", "捕直", "一直", "二直", "三直", "遊直", "左直", "中直", "右直",
            "捕邪飛", "一邪飛", "三邪飛"
          ],
          suffix: " "
        },
        bunt_other: {
          label: "犠打・他",
          items: ["犠打", "犠飛", "併殺打", "敵失", "野選", "盗塁", "盗塁死", "けん制アウト", "タッチアウト"],
          suffix: " "
        },
        strikeout: {
          label: "三振・四死球",
          items: ["見三振", "空三振", "振逃", "四球", "死球", "敬遠"],
          suffix: " "
        },
        status: {
          label: "状況・得点",
          items: ["無死", "一死", "二死", "三死", "＋ 1", "＋ 2", "＋ 3", "＋ 4", "得点"],
          suffix: " "
        },
        single: {
          label: "単字パーツ",
          items: ["投", "捕", "一", "二", "三", "遊", "左", "中", "右", "ゴロ", "飛", "直", "邪", "安", "本", " 2", " 3", "＋"],
          suffix: " "
        }
      };

      return (
        <div className="max-w-md mx-auto p-3 space-y-4">
          
          <datalist id="team-members">
            {teamMembers.map((name, i) => <option key={i} value={name} />)}
          </datalist>

          <div className="bg-slate-800 text-white p-3 rounded-lg shadow-md">
            <h2 className="text-xs font-bold text-slate-400 mb-1">LINE送信プレビュー</h2>
            <pre className="whitespace-pre-wrap font-mono text-sm leading-relaxed bg-slate-900 p-3 rounded border border-slate-700 select-all min-h-[100px]">
              {previewText}
            </pre>
          </div>

          <div className="bg-white p-4 rounded-lg shadow-sm space-y-3">
            <h3 className="font-bold text-slate-700 text-sm border-b pb-1">1. 基本情報</h3>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-xs text-slate-500">大会名</label>
                <input type="text" value={tournament} onChange={(e) => setTournament(e.target.value)} className="w-full text-xs border rounded p-1.5" placeholder="例: 夏季県大会" />
              </div>
              <div>
                <label className="text-xs text-slate-500">球場名</label>
                <input type="text" value={stadium} onChange={(e) => setStadium(e.target.value)} className="w-full text-xs border rounded p-1.5" placeholder="例: 市民球場" />
              </div>
            </div>
            <div className="grid grid-cols-3 gap-2">
              <div>
                <label className="text-xs text-slate-500">先攻チーム</label>
                <input type="text" value={teamA} onChange={(e) => setTeamA(e.target.value)} className="w-full text-xs border rounded p-1.5" placeholder="先攻" />
              </div>
              <div>
                <label className="text-xs text-slate-500">後攻チーム</label>
                <input type="text" value={teamB} onChange={(e) => setTeamB(e.target.value)} className="w-full text-xs border rounded p-1.5" placeholder="後攻" />
              </div>
              <div>
                <label className="text-xs text-slate-500">天候</label>
                <select value={weather} onChange={(e) => setWeather(e.target.value)} className="w-full text-xs border rounded p-1.5 bg-white">
                  <option value="☀️">☀️ 晴れ</option>
                  <option value="☁️">☁️ くもり</option>
                  <option value="☔">☔ 雨</option>
                </select>
              </div>
            </div>
          </div>

          <div className="bg-white p-4 rounded-lg shadow-sm space-y-3">
            <h3 className="font-bold text-slate-700 text-sm border-b pb-1">2. 選手登録（タップでリストから選択）</h3>
            
            <div className="text-[11px] font-bold text-slate-400">▼ スタメン</div>
            <div className="grid grid-cols-3 gap-1.5">
              {starters.map((name, idx) => (
                <div key={idx} className="flex items-center gap-1 border rounded p-1 bg-slate-50">
                  <span className="text-xs font-bold text-emerald-700 w-4">{orderSymbols[idx]}</span>
                  <input
                    type="text"
                    list="team-members"
                    placeholder="選手名"
                    value={name}
                    onChange={(e) => handleStarterChange(idx, e.target.value)}
                    className="w-full text-xs bg-transparent outline-none"
                  />
                </div>
              ))}
            </div>

            <div className="text-[11px] font-bold text-slate-400 mt-2">▼ 控え（代打・代走・交代用）</div>
            <div className="grid grid-cols-3 gap-1.5">
              {bench.map((name, idx) => (
                <div key={`bench-${idx}`} className="flex items-center gap-1 border rounded p-1 bg-slate-50">
                  <span className="text-xs font-bold text-indigo-500 w-4">控</span>
                  <input
                    type="text"
                    list="team-members"
                    placeholder="控え選手"
                    value={name}
                    onChange={(e) => handleBenchChange(idx, e.target.value)}
                    className="w-full text-xs bg-transparent outline-none"
                  />
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white p-4 rounded-lg shadow-sm space-y-3">
            <h3 className="font-bold text-slate-700 text-sm border-b pb-1">3. スコア入力（回ごと）</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-center text-xs">
                <thead>
                  <tr className="bg-slate-100 text-slate-600">
                    <th className="p-1 w-16 text-left">チーム</th>
                    {[1,2,3,4,5,6,7,8,9].map(i => <th key={i} className="p-1 w-6">{i}</th>)}
                  </tr>
                </thead>
                <tbody>
                  <tr className="border-b">
                    <td className="p-1 font-bold text-left truncate max-w-[60px] text-slate-500">{displayTeamA}</td>
                    {scoresA.map((score, idx) => {
                      const isCurrent = currentInning === idx + 1 && currentHalf === 'top';
                      return (
                        <td key={idx} className="p-0.5">
                          <input 
                            type="text" 
                            inputMode="numeric" 
                            value={score} 
                            onFocus={() => { setCurrentInning(idx + 1); setCurrentHalf('top'); }}
                            onChange={(e) => handleScoreChange('A', idx, e.target.value)} 
                            className={`w-full text-center border rounded p-1 transition-colors ${
                              isCurrent ? 'bg-emerald-100 border-emerald-400 font-bold' : 'bg-white'
                            }`} 
                          />
                        </td>
                      );
                    })}
                  </tr>
                  <tr>
                    <td className="p-1 font-bold text-left truncate max-w-[60px] text-slate-500">{displayTeamB}</td>
                    {scoresB.map((score, idx) => {
                      const isCurrent = currentInning === idx + 1 && currentHalf === 'bottom';
                      return (
                        <td key={idx} className="p-0.5">
                          <input 
                            type="text" 
                            inputMode="numeric" 
                            value={score} 
                            onFocus={() => { setCurrentInning(idx + 1); setCurrentHalf('bottom'); }}
                            onChange={(e) => handleScoreChange('B', idx, e.target.value)} 
                            className={`w-full text-center border rounded p-1 transition-colors ${
                              isCurrent ? 'bg-emerald-100 border-emerald-400 font-bold' : 'bg-white'
                            }`} 
                          />
                        </td>
                      );
                    })}
                  </tr>
                </tbody>
              </table>
            </div>
            
            <div className="mt-2 flex items-center justify-between bg-emerald-50 p-2 rounded border border-emerald-200">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-emerald-800">現在の攻撃:</span>
                <span className="text-xs font-bold bg-white px-2 py-1 rounded border border-emerald-300">
                  {currentInning}回 {currentHalf === 'top' ? `表 (${displayTeamA})` : `裏 (${displayTeamB})`}
                </span>
              </div>
              <button
                onClick={handleNextHalf}
                className="px-4 py-1 text-xs font-bold bg-emerald-600 text-white rounded shadow-sm hover:bg-emerald-700 active:scale-95 transition-transform"
              >
                チェンジ 🔄
              </button>
            </div>
          </div>

          <div className="bg-white p-4 rounded-lg shadow-sm space-y-3">
            <h3 className="font-bold text-slate-700 text-sm border-b pb-1">4. 打撃結果・進行入力</h3>
            
            <div className="flex flex-wrap gap-1 bg-slate-100 p-1.5 rounded-lg">
              {Object.keys(presetCategories).map((catKey) => (
                <button
                  key={catKey}
                  onClick={() => setActiveTab(catKey)}
                  className={`px-2 py-1 text-xs rounded font-medium transition-colors ${
                    activeTab === catKey
                      ? 'bg-emerald-600 text-white shadow-sm'
                      : 'bg-white text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {presetCategories[catKey].label}
                </button>
              ))}
            </div>

            <div className="flex flex-wrap gap-1.5 bg-slate-50 p-2 rounded border border-slate-200 max-h-40 overflow-y-auto">
              {presetCategories[activeTab].items.map((item, idx) => {
                const isOnlySymbol = orderSymbols.includes(item);
                const isStarterButton = activeTab === 'order' && (isOnlySymbol || orderSymbols.some(sym => item.startsWith(sym)));
                const suffix = presetCategories[activeTab].suffix;
                
                let btnClass = "px-2.5 py-1 text-xs bg-white text-slate-700 border border-slate-200 rounded shadow-sm font-medium hover:bg-emerald-50";
                
                if (isOnlySymbol) {
                  btnClass = "px-2.5 py-1 text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 rounded shadow-sm font-bold hover:bg-emerald-100";
                } else if (activeTab === 'team' || benchButtons.includes(item)) {
                  btnClass = "px-2.5 py-1 text-xs bg-indigo-50 text-indigo-800 border border-indigo-200 rounded shadow-sm font-medium hover:bg-indigo-100";
                }

                return (
                  <button
                    key={idx}
                    // ★ 3つ目の引数に suffix (スペース) を渡す
                    onClick={() => insertText(item, isStarterButton, suffix)}
                    className={btnClass}
                  >
                    {item}
                  </button>
                );
              })}
            </div>

            <div className="flex gap-1">
              <button onClick={() => insertText(" ")} className="flex-1 py-1 text-xs bg-slate-200 text-slate-700 rounded hover:bg-slate-300 font-medium">全角空白</button>
              <button onClick={() => insertText(" ")} className="flex-1 py-1 text-xs bg-slate-200 text-slate-700 rounded hover:bg-slate-300 font-medium">半角空白</button>
              <button onClick={() => insertText("\n")} className="flex-1 py-1 text-xs bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200 font-bold">↵ 改行</button>
              <button onClick={() => insertText("BACKSPACE")} className="flex-1 py-1 text-xs bg-rose-100 text-rose-700 rounded hover:bg-rose-200 font-bold">⌫ 消去</button>
            </div>

            <div className="border border-slate-200 rounded overflow-hidden">
              <div className="flex bg-slate-100 border-b border-slate-200">
                <button
                  onClick={() => setInputTab('current')}
                  className={`flex-1 py-1.5 text-xs font-bold transition-colors ${
                    inputTab === 'current' ? 'bg-white text-emerald-700 border-b-2 border-emerald-500' : 'text-slate-500 hover:bg-slate-200 border-b-2 border-transparent'
                  }`}
                >
                  📝 現在のイニング
                </button>
                <button
                  onClick={() => setInputTab('history')}
                  className={`flex-1 py-1.5 text-xs font-bold transition-colors ${
                    inputTab === 'history' ? 'bg-white text-emerald-700 border-b-2 border-emerald-500' : 'text-slate-500 hover:bg-slate-200 border-b-2 border-transparent'
                  }`}
                >
                  📚 過去の履歴（編集可）
                </button>
              </div>

              {inputTab === 'current' ? (
                <textarea
                  ref={currentTextareaRef}
                  rows={5}
                  value={details}
                  onChange={(e) => setDetails(e.target.value)}
                  className="w-full text-xs p-2 font-mono leading-relaxed focus:ring-2 focus:ring-emerald-500 outline-none border-none"
                  placeholder="現在のイニングの出来事を入力... (チェンジを押すと過去の履歴へ移動します)"
                />
              ) : (
                <textarea
                  ref={historyTextareaRef}
                  rows={5}
                  value={history}
                  onChange={(e) => setHistory(e.target.value)}
                  className="w-full text-xs p-2 font-mono leading-relaxed focus:ring-2 focus:ring-emerald-500 outline-none border-none bg-slate-50"
                  placeholder="過去のイニングがここに蓄積されます"
                />
              )}
            </div>

          </div>

          <div className="fixed bottom-0 left-0 right-0 p-3 bg-white border-t border-slate-200 shadow-lg z-50">
            <div className="max-w-md mx-auto">
              <button
                onClick={handleCopy}
                className={`w-full py-3 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all ${
                  copied ? 'bg-slate-700' : 'bg-emerald-500 hover:bg-emerald-600 active:scale-98'
                }`}
              >
                {copied ? '✓ クリップボードにコピーしました！' : 'LINE用にテキストをコピー'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
